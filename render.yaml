# Render Web Service Deployment Blueprint for DisputeShield + FreshMart
# Target: Razorpay AI Buildathon 2026 (Track 02: AI Risk Manager)

services:
  - type: web
    name: disputeshield-freshmart
    runtime: node
    plan: starter
    buildCommand: npm install && npm run client:install && npm --prefix client run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: RAZORPAY_INTEGRATION_MODE
        value: simulation
      - key: RUPEE_THRESHOLD
        value: "5000"
    disk:
      name: disputeshield-persistent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
